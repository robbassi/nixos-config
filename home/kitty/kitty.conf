# Setting the display server forces kitty to use the native window titlebar.
linux_display_server wayland

# Cursor trail
cursor_trail 1
curosr_trail_decay 0.1 0.4

# Fonts
font_family      Comic Code Medium
bold_font        auto
italic_font      auto
bold_italic_font auto

# Colors
foreground #ffffff

# transparent background
background #010101
background_opacity 0.95

# black
color0  #222222
color8  #666666

# red
color1  #685742
color9  #685742

# green
color2  #5f875f
color10 #5f875f

# yellow
color3  #b36d43
color11 #b36d43

