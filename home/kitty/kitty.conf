# Setting the display server forces kitty to use the native window titlebar.
linux_display_server wayland

# Cursor trail
cursor_trail 1
curosr_trail_decay 0.1 0.4

# Fonts
font_family      Comic Code
bold_font        auto
italic_font      auto
bold_italic_font auto

# Colors
foreground #ffffff

# transparent background
background #010101
background_opacity 0.95

# Electric Mint palette

color0  #111111  # Black, Charcoal
color1  #ff997f  # Red, Coral Peach
color2  #33ff99  # Green, Electric Mint
color3  #ffcc88  # Yellow, Apricot
color4  #4477ee  # Blue, Cornflower Blue
color5  #ff997f  # Magenta, Coral Peach
color6  #4477ee  # Cyan, Seafoam
color7  #ffffff  # White, Pure White

color8  #777777  # Bright black, Gray
color9  #ff997f  # Bright red, Coral Peach
color10 #33ff99  # Bright green, Electric Mint
color11 #ffcc88  # Bright yellow, Apricot
color12 #4477ee  # Bright blue, Cornflower Blue
color13 #ff997f  # Bright magenta, Coral Peach
color14 #4477ee  # Bright cyan, Seafoam
color15 #ffffff  # Bright white, Pure White
